<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-PaaS | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card">
        <h2>Mini-PaaS Engine</h2>
        <p class="subtitle">Authenticate to manage your infrastructure.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="submit-btn">
              <span class="spinner" id="spinner" style="display: none;"></span>
                <span id="btn-text">Initialize Session</span>
            </button>
        </form>
        <div id="error-message"></div>
        <div class="switch-page">
            No access token? <a href="signup.html">Request access here</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
